<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Coffee shop themed background illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8ecd9"/>
      <stop offset="45%" stop-color="#e4c8a1"/>
      <stop offset="100%" stop-color="#8b5e3c"/>
    </linearGradient>

    <radialGradient id="light" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#fff7e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff7e8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="22" r="1.1" fill="#6a472f" fill-opacity="0.08"/>
      <circle cx="68" cy="54" r="0.9" fill="#6a472f" fill-opacity="0.07"/>
      <circle cx="112" cy="24" r="1.4" fill="#6a472f" fill-opacity="0.06"/>
      <circle cx="34" cy="102" r="1.0" fill="#6a472f" fill-opacity="0.08"/>
      <circle cx="92" cy="116" r="1.2" fill="#6a472f" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>

  <!-- Cozy wall arc shapes -->
  <path d="M0,870 C260,760 510,760 760,870 L760,1080 L0,1080 Z" fill="#7b4e30" fill-opacity="0.38"/>
  <path d="M520,840 C760,700 1140,700 1420,840 L1420,1080 L520,1080 Z" fill="#5a3722" fill-opacity="0.34"/>
  <path d="M1120,890 C1360,760 1660,760 1920,890 L1920,1080 L1120,1080 Z" fill="#3d2618" fill-opacity="0.36"/>

  <!-- Coffee cup silhouette -->
  <g transform="translate(890 575)">
    <ellipse cx="70" cy="250" rx="255" ry="36" fill="#3f2518" fill-opacity="0.28" filter="url(#softBlur)"/>
    <rect x="-120" y="90" width="420" height="160" rx="30" fill="#fff5e6" fill-opacity="0.92"/>
    <rect x="-120" y="86" width="420" height="24" rx="12" fill="#f0dbc2"/>
    <ellipse cx="90" cy="95" rx="205" ry="18" fill="#5a3824"/>
    <ellipse cx="88" cy="94" rx="160" ry="11" fill="#7a4a30"/>
    <path d="M286,118 C365,110 415,143 415,183 C415,226 364,258 286,249" fill="none" stroke="#fff5e6" stroke-width="30" stroke-linecap="round"/>
    <path d="M289,133 C345,127 383,148 383,183 C383,217 345,238 289,233" fill="none" stroke="#e9d7c1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Steam lines -->
  <g transform="translate(940 470)">
    <path d="M-60,100 C-10,50 -40,10 -5,-30 C25,-65 15,-95 -5,-125" fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round"/>
    <path d="M15,95 C55,50 30,10 62,-20 C95,-50 96,-85 82,-115" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round"/>
    <path d="M85,105 C125,60 110,15 138,-18 C170,-52 170,-86 154,-120" fill="none" stroke="url(#steam)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Subtle coffee beans -->
  <g fill="#4a2c1b" fill-opacity="0.2">
    <ellipse cx="200" cy="220" rx="22" ry="14" transform="rotate(-18 200 220)"/>
    <path d="M193 212 C201 218 201 224 193 230" fill="none" stroke="#2f1b11" stroke-opacity="0.22" stroke-width="2"/>

    <ellipse cx="1680" cy="260" rx="24" ry="15" transform="rotate(14 1680 260)"/>
    <path d="M1675 251 C1684 258 1684 265 1675 271" fill="none" stroke="#2f1b11" stroke-opacity="0.22" stroke-width="2"/>

    <ellipse cx="1570" cy="830" rx="20" ry="13" transform="rotate(-22 1570 830)"/>
    <path d="M1564 822 C1572 828 1572 834 1564 840" fill="none" stroke="#2f1b11" stroke-opacity="0.22" stroke-width="2"/>

    <ellipse cx="280" cy="860" rx="23" ry="14" transform="rotate(11 280 860)"/>
    <path d="M273 851 C282 858 282 865 273 871" fill="none" stroke="#2f1b11" stroke-opacity="0.22" stroke-width="2"/>
  </g>
</svg>
